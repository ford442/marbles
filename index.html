<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#1a1a2e">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icon.svg" type="image/svg+xml">
    <title>Marbles 3D</title>
    <script src="./filament.js"></script>
    <style>
        /* Critical styles only — enough to avoid a white flash before the app shell mounts. */
        * { box-sizing: border-box; }
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
            color: #fff;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        canvas { display: block; }
    </style>
</head>

<body>
    <canvas id="canvas"></canvas>
    <canvas id="speedlines-canvas"></canvas>
    <canvas id="webgpu-particles-canvas"></canvas>

    <!-- Static UI partials are mounted here by src/ui/mount-shell.js before game init. -->
    <div id="ui-root"></div>

    <script type="module" src="/src/main.js"></script>

    <script>
        // Visible fallback when a script/stylesheet fails to load (otherwise: black screen).
        (function () {
            var shown = false;
            function show(msg) {
                if (shown) return;
                shown = true;
                var d = document.createElement('div');
                d.id = 'asset-load-error';
                d.style.cssText = 'position:fixed;inset:0;display:flex;align-items:center;justify-content:center;' +
                    'padding:24px;text-align:center;background:#000;color:#fff;z-index:2147483647;font:16px sans-serif;';
                d.textContent = msg;
                document.body.appendChild(d);
            }
            window.addEventListener('error', function (e) {
                var t = e.target;
                if (!t || t === window) return;
                if (t.tagName === 'SCRIPT' || (t.tagName === 'LINK' && t.rel === 'stylesheet')) {
                    show('Failed to load game assets (' + (t.src || t.href) + ')');
                }
            }, true);
        })();
    </script>
</body>

</html>
