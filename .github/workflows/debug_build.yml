name: Marbles CI

on:
  push:
    branches: [main, debug-ci]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Marbles 3D — validate assets, run unit tests, lint, typecheck, build WASM + Vite bundle.
# Reproducibility gates: committed public/wasm/* must match a fresh Emscripten build,
# committed Filament materials must match a fresh matc build (npm run check:materials),
# and the physics determinism digests must match on this runner (npm run test:determinism).
# E2E smoke (tests/e2e/smoke.cjs): optional job after build — continue-on-error on PRs.
# Local: npm run build && npm run preview -- --port 5173 &  then  BASE_URL=http://localhost:5173 npm run test:e2e:smoke
# Full missile e2e: npm run dev  then  npm run test:e2e

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: '3.1.50'
          no-cache: true

      - name: Build WASM
        run: npm run build:wasm

      - name: Verify WASM artefacts
        run: npm run check:wasm

      # The 3.1.50 build is byte-reproducible, so a diff here means the
      # committed public/wasm/* was not rebuilt after a C++/CMake change.
      - name: Committed WASM matches source
        run: git diff --exit-code --stat -- public/wasm/

      # WASM vs JS fallback: fixed vectors, then the per-kernel float32 ULP bound
      # and NaN / Infinity parity (tests/test_wasm_parity_ulp.js).
      - name: WASM parity tests
        run: npm run test:wasm:parity

      # Compile-only smoke of the Debug/ASan target (-Weverything) so flag or
      # sanitizer regressions surface in CI; it is not run under Node here.
      - name: Build WASM (Debug/ASan smoke)
        run: npm run build:wasm:debug

      # matc comes from the Filament release pinned in scripts/filament.json
      # (sha256-checked); cache the download between runs.
      - name: Cache Filament tools
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/filament-tools
          key: filament-tools-${{ runner.os }}-${{ hashFiles('scripts/filament.json') }}

      # The vendored runtime is the pinned release, and every material
      # recompiles to the committed binary with that release's matc.
      - name: Filament runtime + materials match the pinned release
        run: npm run check:materials
        env:
          FILAMENT_TOOLS_DIR: ${{ runner.temp }}/filament-tools

      - name: Validate assets
        run: npm run validate:assets

      # Same seed + inputs through the main-thread and worker backends: the
      # Rapier snapshot must hash identically on every step, and the run digest
      # must equal the one recorded in tests/fixtures (i.e. this runner computes
      # the same bits as the machine that recorded it). Also part of the unit
      # suite below; run on its own first so a determinism break is named.
      - name: Physics determinism (main vs worker, pinned digest)
        run: npm run test:determinism

      - name: Unit tests + level completability harness (tests/levels/)
        run: node scripts/run-unit-tests.mjs

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Type-check coverage ratchet (typed files / LOC share / suppressions)
        run: npm run typecheck:coverage

      - name: Build Vite app (with bundle stats)
        run: BUNDLE_STATS=1 npx vite build

      - name: Bundle size budget (main chunk, no zone/dev-level/editor code)
        run: npm run check:bundle

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: marbles-dist
          path: |
            dist/
            public/wasm/marble_physics.js
            public/wasm/marble_physics.wasm
          retention-days: 7

  e2e-smoke:
    needs: ci
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: marbles-dist
          path: .

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Start preview server
        run: |
          npm run preview -- --port 5173 --host 127.0.0.1 &
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:5173/ > /dev/null; then
              echo "Preview server ready"
              exit 0
            fi
            sleep 1
          done
          echo "Preview server failed to start"
          exit 1

      - name: E2E smoke test
        run: BASE_URL=http://127.0.0.1:5173/ npm run test:e2e:smoke

      - name: E2E gameplay actions (every ability / menu action on a live level)
        run: BASE_URL=http://127.0.0.1:5173/ npm run test:e2e:actions

      # Chromium (page + Web Worker) must reproduce the digests Node recorded.
      # Starts its own dev server on a free port.
      - name: E2E physics determinism (browser == Node)
        run: npm run test:e2e:determinism
